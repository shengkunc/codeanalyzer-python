[project]
name = "simple_repo_python"
version = "0.1.0"
description = "A simple Python project."
readme = "README.md"
authors = [
    { name = "Shengkun Cui", email = "Shengkun.Cui@partner.ibm.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
simple-repo = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["simple_repo"]
