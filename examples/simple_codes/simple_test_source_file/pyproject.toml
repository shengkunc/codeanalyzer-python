[project]
name = "simple_code_python"
version = "0.1.0"
description = "A simple Python file code."
authors = [
    { name = "Shengkun Cui", email = "Shengkun.Cui@partner.ibm.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
